server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:payment-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    servlet:
      path: /api/v1
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

rabbitmq:
  service:
    order:
      exchange-request-name: payment-request-exchange
      queue-request-name: payment-request-queue
      exchange-response-name: payment-response-exchange
      queue-response-name: payment-response-queue
      dlx-name: payment-request-dlx
      dlq-name: payment-request-dlq

resilience4j:
  circuitbreaker:
    instances:
      paymentControllerCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        recordExceptions:
          - java.lang.Exception
        ignoreExceptions:
          - com.chaykin.common.exception.ServiceException

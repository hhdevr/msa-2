services:
  rabbitmq:
    image: rabbitmq:4.2.0-management
    container_name: msa2-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  order-service:
    image: msa2-order:1.0
    ports:
      - "8081:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

  payment-service:
    image: msa2-payment:1.0
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

  delivery-service:
    image: msa2-delivery:1.0
    ports:
      - "8083:8083"

volumes:
  rabbitmq_data:

server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:order-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    servlet:
      path: /api/v1
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: manual
      observation-enabled: true
    template:
      observation-enabled: true
    consumer:
      group-id: order-consumers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"

integration:
  payment-service:
    url: http://localhost:8082/api/v1

rabbitmq:
  service:
    payment:
      exchange-request-name: payment-request-exchange
      queue-request-name: payment-request-queue
      exchange-response-name: payment-response-exchange
      queue-response-name: payment-response-queue
      dlx-name: payment-response-dlx
      dlq-name: payment-response-dlq

kafka:
  service:
    delivery:
      order-paid-topic: order.paid
      delivery-created-topic: delivery.created

resilience4j:
  circuitbreaker:
    instances:
      orderControllerCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        recordExceptions:
          - java.lang.Exception
        ignoreExceptions:
          - com.chaykin.common.exception.ServiceException
      paymentServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        recordExceptions:
          - feign.FeignException
        ignoreExceptions:
          - com.chaykin.common.exception.ServiceException
  retry:
    instances:
      paymentServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - feign.FeignException
        ignoreExceptions:
          - com.chaykin.common.exception.ServiceException
  ratelimiter:
    instances:
      paymentClientRL:
        registerHealthIndicator: true
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
  bulkhead:
    instances:
      paymentClientBH:
        maxConcurrentCalls: 5
        maxWaitDuration: 0ms
